      两篇合起来能给出「本地损坏如何变成全局模型损坏」的完整图景，
      也为把该问题从 reliability 推向 security 提供了必要的现象基础。

  # ═══════════════════ 5. 硬件与执行环境 ═══════════════════

  - id: "2608.25321"
    title: "LLMscope: Extracting LLM Assets from Edge AI Chips via Optical Probing"
    abbr: "LLMscope"
    date: "2026-08"
    venue: "arXiv"
    section: "5"
    boundary: [host-device, supply-chain]
    summary: >-
      通过光学探测手段从边缘 AI 芯片中提取模型资产，把物理层攻击引入 LLM 部署场景。
      与依赖软件侧信道的工作不同，本文的威胁模型假设攻击者可物理接触设备，
