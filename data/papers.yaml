# Awesome-AI-Infra-Security 论文数据源
#
# ⚠️ 这是本仓库的唯一数据源。README.md 与 papers_by_*/ 下所有文件均由
#    scripts/build.py 从本文件生成，请勿手工编辑那些文件。
#
# 字段说明（必填项标 *）：
#   id*        arXiv ID，如 2608.09225（不带版本号）。非 arXiv 来源用 url 字段
#   title*     论文官方完整标题
#   abbr       方法/系统缩写，如 GIFT
#   date*      arXiv v1 提交日期，YYYY-MM。非 arXiv 条目填发表年月
#   venue      发表会议/期刊，未发表填 arXiv
#   section*   所属小节 ID，见 data/sections.yaml
#   boundary*  信任边界标签，多选：cross-tenant / cross-request / host-device /
#              inter-node / supply-chain / model-internal
#   summary*   中文简介，2-4 句 150-300 字，须含动机/机制/关键数字
#   code       代码仓库 URL
#   url        非 arXiv 来源的链接（第 7 章与会议论文用）
#
# 收录边界（详见 CONTRIBUTING.md）—— 三条最容易失守的线：
#   1. Security-of-AI 而非 AI-for-Security：「用 MoE 做恶意软件分类」不收
#   2. Infra 层而非模型层：必须涉及 serving/training 系统的状态、资源或拓扑。
#      纯模型层对齐研究不收（这是 quantization × safety 检索里最大的噪音来源）
#   3. 攻击/防御的作用点必须在基础设施上，而不是把通用越狱换个部署环境重跑

papers:
  # ═══════════════════ 0. 威胁模型与综述 ═══════════════════

  # ═══════════════════ 1.1 KV / Prefix Cache 侧信道与泄露 ═══════════════════

  - id: "2608.09225"
    title: "Governing the KV Cache: Preventing Timing Side-Channel Leakage in Multi-Tenant LLM Inference"
    abbr: "KV Governance"
    date: "2026-08"
    venue: "arXiv"
    section: "1.1"
    boundary: [cross-tenant, cross-request]
    summary: >-
      KV cache 是现代 LLM 推理最主要的吞吐优化手段，它让 prefix 可以跨请求复用；
      但在多租户部署下这份缓存是共享的，命中与否会体现在首 token 时延上，
      于是纯粹的性能优化直接变成了隐私侧信道。本文系统刻画了 vLLM 与 SGLang 中
      prefix 复用带来的 timing channel，并给出缓存治理层面的防御设计，
      在保留大部分复用收益的同时切断攻击者据时延差异探测他人缓存内容的能力。

  - id: "2608.20732"
    title: "Uncovering and Understanding Hidden Dependencies in the LLM API Reseller Ecosystem via Prefix-Cache Side Channels"
    abbr: "Reseller Probing"
    date: "2026-08"
    venue: "arXiv"
    section: "1.1"
    boundary: [cross-tenant, supply-chain]
    summary: >-
      LLM API 转售商已成为访问模型服务的重要一层，但多级转售让供应链变得不透明：
      用户的请求可能经过若干未披露的上游。本文把 prefix-cache 侧信道用作探针，
      通过构造探测 prompt 并观测缓存命中特征，反推出转售商背后的真实上游依赖关系。
      这是一个把 infra 侧信道用于生态测绘的有趣转向 —— 侧信道不止能偷 prompt，
      还能揭示服务提供方刻意隐藏的拓扑结构，对合规与数据流向审计都有直接意义。

  - id: "2607.19957"
    title: "HijackKV: New Threat in Position-Independent KV Cache Reuse"
    abbr: "HijackKV"
    date: "2026-07"
    venue: "arXiv"
    section: "1.4"
    boundary: [cross-request, cross-tenant]
    summary: >-
      为提升复用率，新一代缓存方案允许位置无关的 KV 重用 —— 同一段文本的 KV
      不再绑定在原有位置上即可被复用。本文指出这种放松引入了新的攻击面：
      攻击者可以让被复用的 KV 片段在新上下文中承载与原意不同的语义，
      从而在模型输入表面完全正常的情况下篡改其内部上下文。这类攻击的隐蔽性在于
      prompt 本身是良性的，被改变的是模型实际看到的内部状态。

  - url: "https://www.ndss-symposium.org/ndss-paper/i-know-what-you-asked-prompt-leakage-via-kv-cache-sharing-in-multi-tenant-llm-serving/"
    title: "I Know What You Asked: Prompt Leakage via KV-Cache Sharing in Multi-Tenant LLM Serving"
    abbr: "PromptPeek"
    date: "2025-02"
    venue: "NDSS 2025"
    section: "1.1"
    boundary: [cross-tenant]
    summary: >-
      南方科技大学与字节跳动的工作，是 KV prefix 共享攻击这条线的奠基论文之一。
      作者提出 PromptPeek 攻击：在多租户 serving 中，攻击者通过构造候选 prefix
      并测量首 token 时延判断缓存是否命中，据此逐步推断出其他用户 prompt 的内容。
      该工作直接推动了工程侧的防御响应 —— vLLM 随后引入 cache_salt 机制，
      把租户标识注入首个 cache block 的 hash 以隔离这条 timing channel。

  - url: "https://github.com/XingTuLab/Cache_Me_Catch_You"
    title: "Cache Me, Catch You: Cache Related Security Threats in LLM Serving Frameworks"
    abbr: "Cache Me Catch You"
    date: "2026-02"
    venue: "NDSS 2026"
    section: "1.4"
    boundary: [cross-tenant, cross-request]
    summary: >-
      系统性审计了 LLM serving 框架中各类缓存的安全问题，指出现代 serving 的缓存
      已不止 KV 一种，而是 prefix cache、semantic cache、image cache 并存。
      作者发现了 prefix-cache hash 碰撞、image-cache 碰撞以及 semantic cache
      的语义不一致三类问题，并落地为真实漏洞（含 CVE-2025-25183、CVE-2025-46722 等）。
      这篇是本仓库第 7 章「工程侧安全」与学术研究结合得最好的范例。
    code: "https://github.com/XingTuLab/Cache_Me_Catch_You"

  # ═══════════════════ 1.2 Activation / Embedding 状态泄露 ═══════════════════

  - id: "2608.02995"
    title: "SparSEEty: Extracting Tokens from Sparsity-Exploiting LLM Serving Systems via Deterministic Side Channels"
    abbr: "SparSEEty"
    date: "2026-08"
    venue: "arXiv"
    section: "1.2"
    boundary: [cross-tenant, host-device]
    summary: >-
      现代 LLM 存在激活稀疏性，只有部分神经元会被给定 token 激活，serving 系统
      普遍利用这一性质做优化。本文指出这种优化把模型的内部激活模式暴露成了
      可观测的确定性侧信道：由于稀疏模式与输入 token 强相关且执行路径确定，
      攻击者可据此反推出被处理的 token。这是「性能优化把模型内部状态外化」
      这一类问题的典型案例，与 KV cache 侧信道同源但作用在激活层面。

  # ═══════════════════ 1.3 解耦推理与 KV 跨节点搬运 ═══════════════════

  - id: "2607.24692"
    title: "Denial of Deadline: Network-Driven Accuracy Collapse in Distributed Inference Pipelines"
    abbr: "Denial of Deadline"
    date: "2026-07"
    venue: "arXiv"
    section: "1.3"
    boundary: [inter-node]
    summary: >-
      分布式推理流水线依赖节点间网络按时交付中间结果，本文指出攻击者无需击穿
      任何计算节点，只要在网络层制造有针对性的延迟，就能让流水线错过截止时间，
      迫使系统退化到降级路径并造成精度崩塌。这类攻击的特殊之处在于攻击目标
      既不是可用性也不是机密性，而是**推理结果的正确性**，
      且从单节点视角看每个组件都在正常工作。

  # ═══════════════════ 2.1 Scheduler 状态操纵与延迟 DoS ═══════════════════

  - id: "2602.07878"
    title: "Rethinking Latency Denial-of-Service: Attacking the LLM Serving Framework, Not the Model"
    abbr: "Fill and Squeeze"
    date: "2026-02"
    venue: "arXiv"
    section: "2.1"
    boundary: [cross-tenant]
    summary: >-
      传统 DoS 靠海量请求压垮算力，本文指出 LLM serving 存在更廉价的路径：
      攻击的不是 GPU FLOPS，而是 serving 框架的状态机。作者提出 Fill and Squeeze
      两阶段攻击 —— Fill 阶段用精心构造的请求占满全局 KV cache，
      Squeeze 阶段迫使调度器对其他租户的请求反复抢占与重算。
      评估中受害者的首 token 时延劣化可达数十至数百倍量级，
      而攻击者只需少量完全合法的 API 请求。

  - id: "2608.29745"
    title: "JITterFlip: Uncovering Fault Attack Surfaces in JIT-Compiled LLM Serving"
    abbr: "JITterFlip"
    date: "2026-08"
    venue: "arXiv"
    section: "5"
    boundary: [host-device]
    summary: >-
      现代 serving 框架大量依赖 JIT 编译生成算子内核，本文系统梳理了这一层
      此前未被审视的故障攻击面。作者指出 JIT 产物在运行时驻留于可被故障注入
      影响的内存区域，针对性的比特翻转可以改变内核行为而不触发任何完整性检查。
      这把传统硬件故障攻击与 LLM serving 的动态编译特性接在了一起，
      属于本仓库「硬件与执行环境」章节里少见的 infra-native 工作。

  # ═══════════════════ 2.2 MoE 路由侧信道 ═══════════════════

  - id: "2508.15036"
    title: "MoEcho: Exploiting Side-Channel Attacks to Compromise User Privacy in Mixture-of-Experts LLMs"
    abbr: "MoEcho"
    date: "2025-08"
    venue: "CCS 2025"
    section: "2.2"
    boundary: [cross-tenant, host-device]
    summary: >-
      东北大学团队的工作，是 MoE 架构侧信道这条线的代表作。核心观察是 MoE 让
      模型语义决定物理执行路径：不同领域的 prompt 会激活不同的专家组合。
      作者利用 CPU/GPU 上的 cache、TLB、performance counter 等侧信道推断专家
      激活模式，并进一步还原 prompt 与 response 信息。这是标准的
      「模型架构 × 系统安全」交叉点 —— 攻击可行性直接来自架构设计本身，
      而非某个实现缺陷。发表于 CCS 2025，pp. 2159–2173。

  - id: "2608.10614"
    title: "Trigger the Straggler: Load Hijack on Mixture-of-Experts LLMs"
    abbr: "Trigger the Straggler"
    date: "2026-08"
    venue: "arXiv"
    section: "2.4"
    boundary: [inter-node, cross-tenant]
    summary: >-
      专家并行是跨多 GPU 部署 MoE 的常见策略，router 的决策同时决定了激活哪些专家
      以及哪块 GPU 承担负载。本文指出攻击者可以构造输入把负载定向堆到少数设备上，
      人为制造 straggler，从而干扰同一部署上其他租户的延迟。
      这是 Semantic-to-Resource 攻击面的一个干净样本：一段合法 prompt
      经由路由机制被放大成物理层面的资源倾斜与跨租户干扰。

  # ═══════════════════ 2.3 MoE 路由操纵与 Safety 削弱 ═══════════════════

  - id: "2512.21008"
    title: "GateBreaker: Gate-Guided Attacks on Mixture-of-Expert LLMs"
    abbr: "GateBreaker"
    date: "2025-12"
    venue: "USENIX Security 2026"
    section: "2.3"
    boundary: [model-internal]
    summary: >-
      发现 MoE 模型中存在一批在有害输入上被过度路由的「safety experts」，
      模型的拒答行为高度依赖这少数专家。作者据此提出门控引导的攻击：
      只需禁用约 3% 的神经元，攻击成功率就从 7.4% 抬升到 64.9%。
      这个结果的意义在于揭示了 MoE 的安全对齐在架构层面是**局部且脆弱**的 ——
      对齐信号集中在少量专家上，因而可以被针对性地绕过。已被 USENIX Security 2026 接收。

  - id: "2605.04446"
    title: "Misrouter: Exploiting Routing Mechanisms for Input-Only Attacks on Mixture-of-Experts LLMs"
    abbr: "Misrouter"
    date: "2026-05"
    venue: "arXiv"
    section: "2.3"
    boundary: [model-internal]
    summary: >-
      与需要改动权重或访问内部状态的攻击不同，本文探讨仅通过输入操纵路由的可能性。
      攻击者不接触模型参数，只构造输入去改变 router 的专家选择，
      使推理绕开承担安全职责的专家。这个威胁模型比 GateBreaker 更贴近真实部署
      （攻击者通常只有 API 访问权），也因此更值得关注 ——
      它说明 MoE 的路由机制本身就是一个可被合法输入操纵的攻击面。

  - id: "2605.02946"
    title: "RouteHijack: Routing-Aware Attack on Mixture-of-Experts LLMs"
    abbr: "RouteHijack"
    date: "2026-05"
    venue: "arXiv"
    section: "2.3"
    boundary: [model-internal]
    summary: >-
      从路由感知的角度构造针对 MoE 的攻击，与 GateBreaker、Misrouter 共同勾勒出
      「routing 是 MoE 安全薄弱环节」这一判断。三篇工作的差异在威胁模型强度：
      GateBreaker 需要神经元级干预，Misrouter 限定为仅输入操纵，
      本文则聚焦攻击者对路由行为的建模与利用。
      收录这三篇是为了让读者能直接对比同一攻击面下不同威胁模型的可行性边界。

  # ═══════════════════ 3. Infra 优化引发的 Safety 漂移 ═══════════════════

  - id: "2606.09864"
    title: "Alignment Collapse Under KV Cache Quantization: Diagnosis and Mitigation"
    abbr: "Alignment Collapse"
    date: "2026-06"
    venue: "arXiv"
    section: "3"
    boundary: [model-internal]
    summary: >-
      本文给出了「infra 优化偷偷改变模型安全性」最直接的证据：
      KV cache 量化可以在 perplexity 几乎不变的情况下显著破坏模型的拒答与对齐行为。
      这个现象很反直觉 —— 按传统 infra 视角，量化只是 performance/accuracy 的权衡，
      而 accuracy 指标显示一切正常。作者进一步诊断了漂移的来源并给出缓解方案。
      这篇支撑了本章的核心问题：safety 是否应当成为 infra optimization 的 invariant。

  - id: "2608.27512"
    title: "Quantization-Triggered Backdoors in Language Models: Cross-Quantizer Transferability and the Validation--Deployment Gap"
    abbr: "Quant Backdoor"
    date: "2026-08"
    venue: "arXiv"
    section: "3"
    boundary: [supply-chain, model-internal]
    summary: >-
      研究一类由量化触发的后门：模型在全精度下表现完全正常，只有在被量化部署后
      恶意行为才显现。本文进一步考察了这种后门在不同量化器之间的可迁移性，
      说明攻击并不依赖某个特定量化实现。这条线把 infra 优化与供应链安全接在了一起 ——
      部署环节的常规操作成为攻击的触发条件，
      意味着仅审计发布的全精度权重不足以保证部署后的安全。

  - url: "https://aclanthology.org/2026.acl-long.1123/"
    title: "When Efficiency Meets Safety: A Benchmark Security Analysis of KV Cache Compression in Large Language Models"
    abbr: "Safe-CAM"
    date: "2026-07"
    venue: "ACL 2026"
    section: "3"
    boundary: [model-internal]
    summary: >-
      系统研究了 KV cache 压缩与越狱之间的关系，是这一交叉方向上少见的
      benchmark 级工作。作者发现不同压缩方法对安全性的影响方向并不一致 ——
      有的削弱安全性，有的反而增强，说明「压缩必然损害 safety」的直觉过于简化。
      文中提出 Safe-CAM 作为缓解方案。ACL 2026 Long Paper，pp. 24472–24485。

  - url: "https://aclanthology.org/2026.findings-acl.993/"
    title: "Preserving Fairness and Safety in Quantized LLMs Through Critical Weight Protection"
    abbr: "Critical Weight Protection"
    date: "2026-07"
    venue: "Findings of ACL 2026"
    section: "3"
    boundary: [model-internal]
    summary: >-
      针对量化导致公平性与安全性退化的问题，提出通过保护关键权重来维持这两项属性。
      与只关注 perplexity 或下游任务准确率的常规量化工作不同，
      本文把 fairness 与 safety 当作需要显式保护的目标。
      这正是本章想推动的范式转变：infra 优化的约束条件应从
      `accuracy >= X` 扩展为 `utility >= X AND safety >= Y`。
      Findings of ACL 2026，pp. 19831–19855。

  - id: "2609.02293"
    title: "SEAL: Reinforcing Global Safety in Mixture-of-Experts through Shared Expert ALignment"
    abbr: "SEAL"
    date: "2026-09"
    venue: "arXiv"
    section: "6"
    boundary: [model-internal]
    summary: >-
      针对 MoE 安全对齐局部化的问题（即 GateBreaker 揭示的少数专家承担全部安全职责），
      提出通过共享专家对齐来强化全局安全性。思路是不再把 safety 押在个别专家上，
      而是让承担安全职责的能力在专家间共享，从而抬高针对性绕过的成本。
      这是本仓库防御章节中直接回应 MoE 路由攻击的工作，
      建议与第 2.3 节的三篇攻击工作对照阅读。

  # ═══════════════════ 4. 训练侧完整性 ═══════════════════

  - url: "https://www.usenix.org/conference/osdi26/presentation/lei"
    title: "Safeguarding LLM Training at Scale: Online SDC Detection and Insights from 35 Million GPU Hours"
    abbr: "AEGIS"
    date: "2026-07"
    venue: "OSDI 2026"
    section: "4"
    boundary: [inter-node, supply-chain]
    summary: >-
      清华与字节跳动基于 3500 万 GPU-hours 生产环境数据研究在线静默数据损坏检测，
