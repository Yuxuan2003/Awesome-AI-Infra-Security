  # ═══════════════════ 6. 防御与系统机制 ═══════════════════

  - id: "2608.25431"
    title: "Here is a GIFT: Enforcing User Data Isolation in LLM Serving via GPU Information Flow Tracking"
    abbr: "GIFT"
    date: "2026-08"
    venue: "arXiv"
    section: "6"
    boundary: [cross-tenant, host-device]
    summary: >-
      LLM serving 框架在共享基础设施上处理大量用户数据，其中常含敏感信息，
      而共享同一框架的用户之间缺乏强隔离保证。GIFT 把信息流追踪下沉到 GPU 层面，
      在 vLLM 上实现了对用户数据流向的强制隔离。这是防御章节里少见的
      系统机制级工作 —— 不是在输入输出侧加过滤器，
      而是在执行基础设施内部建立可强制的隔离边界。

  - url: "https://docs.vllm.ai/en/latest/design/prefix_caching.html"
    title: "vLLM Automatic Prefix Caching: Cache Isolation for Security (cache_salt)"
    abbr: "cache_salt"
    date: "2025-06"
    venue: "vLLM 官方文档"
    section: "7"
    boundary: [cross-tenant]
    summary: >-
      vLLM 针对 prefix cache timing 侧信道的官方防御机制。请求可携带 cache_salt
      参数，该值会被注入首个 cache block 的 hash 计算，使不同租户即使 prefix 相同
      也不会命中彼此的缓存。官方文档明确说明其目的是
      "prevents timing-based attacks where an adversary could infer cached content
      by observing latency differences"。这条是学术攻击工作直接推动工程侧防御落地的
      范例，也是第 7 章「工程侧安全」的典型条目形态。
