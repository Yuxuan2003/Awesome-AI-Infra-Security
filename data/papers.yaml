      与 13 块故障 GPU，运行开销仅 0.86%。这篇的价值在于用生产数据证实了
      「单个 rank 的错误可经 collective 传播为全局模型污染」不是理论担忧。
      目前该方向多停留在 reliability 视角，若把 accidental faulty worker
      换成 malicious worker，分布式训练完整性几乎是一片空白。

  - id: "2608.30769"
    title: "TrainSDC: Characterizing and Mitigating Silent Data Corruption in Large Language Model Training"
    abbr: "TrainSDC"
    date: "2026-08"
    venue: "arXiv"
    section: "4"
    boundary: [inter-node]
    summary: >-
